services:
  postgres:
    image: postgres:16-alpine
    container_name: unefa_pg16
    environment:
      POSTGRES_DB: unefa_bss
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
    ports:
      - "5432:5432"
    volumes:
      - pg16_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d unefa_bss"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  scylla-node1:
    image: scylladb/scylla:5.4
    container_name: scylla-node1
    command: --smp 1 --memory 512M --overprovisioned 1 --developer-mode 1
    ports:
      - "9042:9042"
    volumes:
      - scylla_data:/var/lib/scylla
    deploy:
      resources:
        limits:
          memory: 1536m
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'SELECT now() FROM system.local;'"]
      interval: 10s
      timeout: 10s
      retries: 15
    restart: unless-stopped

volumes:
  pg16_data:
  scylla_data:
